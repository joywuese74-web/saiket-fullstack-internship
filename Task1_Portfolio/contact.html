<section id="contact" class="section">
  <div class="container">
    <h2 class="section-title"><span class="accent">03.</span> Contact Me</h2>

    <div class="row justify-content-center">
      <div class="col-lg-7">
        <form id="contactForm" class="info-card" novalidate>

          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control">
            <div class="invalid-feedback" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control">
            <div class="invalid-feedback" id="emailError"></div>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" rows="5" class="form-control"></textarea>
            <div class="invalid-feedback" id="messageError"></div>
          </div>

          <button type="submit" class="btn btn-teal w-100">Send Message</button>

          <div id="successMsg" class="alert alert-success mt-3 d-none">
            Thank you! Your message has been received.
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
